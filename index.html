<!DOCTYPE html>
<html>
<head>
  <title>Users</title>
</head>
<body>
  <h1>Users</h1>

  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="users"></tbody>
  </table>

  <script>
    fetch("/.netlify/functions/users")
      .then(response => response.json())
      .then(users => {
        document.getElementById("users").innerHTML = users.map(user => `
          <tr>
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
          </tr>
        `).join("");
      });
  </script>
</body>
</html>
