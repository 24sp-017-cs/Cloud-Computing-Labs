<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify DB Connection</title>
</head>
<body>
    <h1>Data from Netlify Database</h1>
    <ul id="db-results">Loading data...</ul>

    <script>
        async function fetchDatabaseData() {
            const listContainer = document.getElementById('db-results');
            try {
                // Hits the Netlify serverless routing endpoint
                const response = await fetch('/.netlify/functions/get-data');
                if (!response.ok) throw new Error('Failed to query database function');
                
                const data = await response.json();
                listContainer.innerHTML = ''; // Clear loading text
                
                if(data.length === 0) {
                    listContainer.innerHTML = '<li>No rows found in table.</li>';
                    return;
                }

                data.forEach(row => {
                    const li = document.createElement('li');
                    li.textContent = `ID: ${row.id} — Name: ${row.name}`;
                    listContainer.appendChild(li);
                });
            } catch (err) {
                listContainer.textContent = 'Error loading database resources.';
                console.error(err);
            }
        }

        // Initialize request on page load
        fetchDatabaseData();
    </script>
</body>
</html>
